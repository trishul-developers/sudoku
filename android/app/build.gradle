import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// The repository's package.json is the sole release version source. Increment the
// SemVer version there, then push the corresponding vX.Y.Z tag.
def appVersion = new JsonSlurper().parse(file('../../package.json')).version.toString()
if (!(appVersion ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException('package.json version must use major.minor.patch')
}
def versionParts = appVersion.split('\\.').collect { Integer.parseInt(it) }
if (versionParts[0] > 2000 || versionParts[1] > 999 || versionParts[2] > 999) {
    throw new GradleException('Version exceeds the Android versionCode encoding range')
}
def appVersionCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]

// Release builds are signed ONLY when all four values are explicitly provided.
// GitHub release CI fails closed if the secrets have not been configured.
def signingVariables = [
    'ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'
]
def hasReleaseSigning = signingVariables.every { System.getenv(it)?.trim() }

android {
    namespace 'com.trishul.sudoku'
    compileSdk 36

    defaultConfig {
        applicationId 'com.trishul.sudoku'
        minSdk 24
        targetSdk 36
        versionCode appVersionCode
        versionName appVersion
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig false
    }
}
