name: Verify

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Sudoku engine and offline PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test puzzle generation, game assets and release invariants
        run: npm test
      - name: Verify Android web assets match canonical PWA
        run: |
          npm run sync:android
          git diff --exit-code -- android/app/src/main/assets
      - name: Build offline web package
        run: |
          npm run package:pwa
          unzip -tq dist/sudoku-pwa-v*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-preview
          path: dist/sudoku-pwa-v*.zip
          retention-days: 14

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK Platform 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify no Android permissions and offline assets
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > permissions.txt
          if grep -q 'uses-permission' permissions.txt; then cat permissions.txt; exit 1; fi
          unzip -Z1 "$APK" | grep -Fx 'assets/index.html'
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
