name: Signed release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build and publish APK, AAB and PWA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify tag, version and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must be vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          APP_VERSION=$(node -p 'require("./package.json").version')
          if [[ "$TAG" != "v$APP_VERSION" ]]; then
            echo "Tag $TAG does not match package.json version $APP_VERSION" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo 'Release tags must point to a commit already on main' >&2
            exit 1
          fi
          npm test
          npm run sync:android
          git diff --exit-code -- android/app/src/main/assets/web

      - name: Require Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Missing Android signing secrets: refusing to publish unsigned release' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sudoku-release.jks"
          test -s "$RUNNER_TEMP/sudoku-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/sudoku-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners already provide the Android SDK and command-line tools.
          # Avoid setup-android@v3: it attempts to install the removed SDK package 'tools'.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sudoku-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify signatures, privacy and bundle contents
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          JAR_VERIFY_OUTPUT="$(jarsigner -verify "$AAB")"
          grep -Fq 'jar verified.' <<< "$JAR_VERIFY_OUTPUT"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump permissions "$APK" > permissions.txt
          if grep -q 'uses-permission' permissions.txt; then
            echo 'Unexpected Android permission detected' >&2
            cat permissions.txt
            exit 1
          fi
          unzip -Z1 "$APK" | grep -Fx 'assets/web/index.html'
          unzip -Z1 "$AAB" | grep -Fx 'base/assets/web/index.html'

      - name: Package assets and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/package-pwa.sh
          cp android/app/build/outputs/apk/release/app-release.apk "dist/sudoku-${TAG}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/sudoku-${TAG}.aab"
          cd dist
          sha256sum "sudoku-${TAG}.apk" "sudoku-${TAG}.aab" "sudoku-pwa-${TAG}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.apk dist/*.aab dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "Sudoku $TAG"

      - name: Clear local signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sudoku-release.jks"
