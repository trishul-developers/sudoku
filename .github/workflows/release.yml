name: Signed release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign and publish APK, AAB, PWA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify release tag and run tests
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION=$(node -p 'require("./package.json").version')
          [[ "$TAG" == "v$VERSION" ]] || { echo "Tag $TAG differs from package version $VERSION" >&2; exit 1; }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Release must be on main' >&2; exit 1; }
          npm test
          npm run sync:android
          git diff --exit-code -- android/app/src/main/assets

      - name: Verify signing secrets and keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || {
            echo 'Android signing secrets are missing' >&2; exit 1;
          }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sudoku-release.jks"
          test -s "$RUNNER_TEMP/sudoku-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/sudoku-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build signed Android APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sudoku-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify signed artifacts and absence of permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          jarsigner -verify "$AAB" | grep -Fx 'jar verified.'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > permissions.txt
          if grep -q 'uses-permission' permissions.txt; then cat permissions.txt; exit 1; fi
          unzip -Z1 "$APK" | grep -Fx 'assets/index.html'
          unzip -Z1 "$AAB" | grep -Fx 'base/assets/index.html'

      - name: Build release packages and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm run package:pwa
          cp android/app/build/outputs/apk/release/app-release.apk "dist/sudoku-${TAG}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/sudoku-${TAG}.aab"
          (cd dist && sha256sum "sudoku-${TAG}.apk" "sudoku-${TAG}.aab" "sudoku-pwa-${TAG}.zip" > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.apk dist/*.aab dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --generate-notes --title "Pure Sudoku $TAG"

      - name: Destroy temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sudoku-release.jks"
